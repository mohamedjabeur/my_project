# Livox Mid-360 (3D, 360 x -7..+52 deg) -> 2D /scan for perception / Nav2 / autonomy.
# target_frame is the LEVEL frame at lidar height (lidar_level_link in enimia.urdf), so the heights below are
# relative to the lidar (0.78 m above ground): band -0.60..+0.30 = objects from 0.18 m to 1.08 m above the road.
# The ground (-0.78 m) is excluded; the 0.12 m z_min of lidar_obstacle_detector still applies afterwards.
pointcloud_to_scan:
  ros__parameters:
    target_frame: lidar_level_link
    transform_tolerance: 0.1
    min_height: -0.60
    max_height: 0.30
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0175      # 1 deg: ~5 cloud points per bin at 10 m (0.5 deg left most bins empty)
    scan_time: 0.1               # Mid-360 at 10 Hz
    range_min: 0.2
    range_max: 40.0
    use_inf: true
    inf_epsilon: 1.0
