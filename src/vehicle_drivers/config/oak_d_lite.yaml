# OAK-D Lite via depthai_ros_driver: colour camera only (lane / line detection). Depth + stereo are off to save USB
# bandwidth and the host CPU; the Mid-360 gives the 3D obstacles. Enable them later if needed.
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGB
      i_nn_type: none
      i_enable_imu: false          # the OAK-D Lite has no IMU anyway; the BNO055 is used
      i_publish_tf_from_calibration: false   # TF comes from enimia.urdf (camera_link / camera_optical_link)
    rgb:
      i_resolution: "1080P"
      i_fps: 15.0
      i_width: 960                 # ISP downscale 1920x1080 -> 960x540 (16:9, as in the sim 800x450)
      i_height: 540
      i_publish_topic: true
      i_output_isp: true
